[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-vidore"
version = "0.1.0"
description = "Vi-ViDoRe: Vietnamese Visual Document Retrieval Benchmark"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Vi-ViDoRe Contributors", email = "anonymous@example.com"}
]
maintainers = [
    {name = "Vi-ViDoRe Contributors", email = "anonymous@example.com"}
]
keywords = [
    "visual-document-retrieval",
    "multi-vector-retrieval",
    "late-interaction",
    "colpali",
    "colqwen",
    "vietnamese",
    "benchmark",
    "information-retrieval"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=5.15,<6.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "datasets>=2.19.0",
    "einops>=0.7.0",
    "colpali-engine>=0.3.0,<0.4.0",
    "pylate>=0.1.0",
    "sentence-transformers>=6.0.0,<7.0.0",
    "PyMuPDF>=1.24.0",
    "pdf2image>=1.17.0",
    "pillow>=10.0.0",
    "imagehash>=4.3.1",
    "pydantic>=2.0.0",
    "rank-bm25>=0.2.2",
    "pyvi>=0.1.1",
    "underthesea>=6.8.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "pytest>=8.0.0",
    "PyWavelets>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.11.0",
    "bandit>=1.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]
gpu = [
    "torch>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/Ducduyzs/Vi-ViDoRe-A-Governed-Multi-Domain-Benchmark-for-Vietnamese-Visual-Document-Retrieval"
Repository = "https://github.com/Ducduyzs/Vi-ViDoRe-A-Governed-Multi-Domain-Benchmark-for-Vietnamese-Visual-Document-Retrieval"
Issues = "https://github.com/Ducduyzs/Vi-ViDoRe-A-Governed-Multi-Domain-Benchmark-for-Vietnamese-Visual-Document-Retrieval/issues"
Documentation = "https://github.com/Ducduyzs/Vi-ViDoRe-A-Governed-Multi-Domain-Benchmark-for-Vietnamese-Visual-Document-Retrieval#readme"

[project.scripts]
vi-vidore-build = "scripts.05_build_governed_benchmark:main"
vi-vidore-baselines = "scripts.03_run_baselines:main"
vi-vidore-train = "scripts.04_train_adaptation:main"
vi-vidore-pool = "scripts.pool_candidates:main"
vi-vidore-adjudicate = "scripts.adjudicate:main"
vi-vidore-verify-licenses = "scripts.verify_licenses:main"
vi-vidore-validate-registry = "scripts.validate_registry:main"
vi-vidore-contamination = "scripts.contamination_report:main"
vi-vidore-pilot = "scripts.pilot_tracker:main"
vi-vidore-balance = "scripts.balance_domains:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "PI",
    "T20",
]
ignore = [
    "E501",
    "B008",
]
per-file-ignores = { "tests/*" = ["S101", "S106"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_optional = false
allow_untyped_globals = false
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "skip"
exclude = [
    "data/",
    "results/",
    "checkpoints/",
    "tmp/",
    ".venv/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
]

[tool.bandit]
exclude_dirs = ["tests", "data", "results", "checkpoints", "tmp"]
skip = ["B101", "B601"]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    "*/conftest.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2